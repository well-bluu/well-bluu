name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # once a day
  workflow_dispatch: # lets you run it from the Actions tab
  push:
    branches: [main, master]
    paths: [".github/workflows/update-cards.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&line_height=20&hide_border=true&border_radius=20&card_width=495&bg_color=222222&title_color=ffffff&text_color=b8b8b8&icon_color=ffffff&ring_color=ffffff&custom_title=Numbers
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&border_radius=20&card_width=495&bg_color=222222&title_color=ffffff&text_color=b8b8b8&custom_title=Languages
          path: profile/langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
